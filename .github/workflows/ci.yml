name: CI
on: [pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run validate:local
      - run: npm run validate:staging
      - run: npm run validate:production
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://localhost
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-public-placeholder
          NEXT_PUBLIC_APP_BASE_URL: https://localhost
      - run: npm run typecheck
      - run: npm test
